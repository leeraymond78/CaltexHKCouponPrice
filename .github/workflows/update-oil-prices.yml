name: Update oil prices

on:
  schedule:
    # 05:00 HKT = 21:00 UTC (previous calendar day in UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Consumer Council oil prices
        run: |
          mkdir -p data
          curl -fsSL \
            -A "Mozilla/5.0 (compatible; CaltexHKCouponPrice/1.0; +https://github.com/${{ github.repository }})" \
            -o data/oilprice.json \
            "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json"
          python3 -m json.tool data/oilprice.json > /dev/null
          echo "Fetched $(wc -c < data/oilprice.json) bytes"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oilprice.json
          if git diff --staged --quiet; then
            echo "No price changes."
          else
            git commit -m "chore: update oil prices ($(TZ=Asia/Hong_Kong date +%Y-%m-%d))"
            git push
          fi
