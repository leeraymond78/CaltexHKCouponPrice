name: Update oil prices

on:
  schedule:
    # 05:00 HKT = 21:00 UTC (previous calendar day in UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep previous prices for comparison
        run: cp data/oilprice.json /tmp/oilprice.old.json

      - name: Fetch Consumer Council oil prices
        run: |
          mkdir -p data
          curl -fsSL \
            -A "Mozilla/5.0 (compatible; CaltexHKCouponPrice/1.0; +https://github.com/${{ github.repository }})" \
            -o data/oilprice.json \
            "https://www.consumer.org.hk/pricewatch/oilwatch/opendata/oilprice.json"
          python3 -m json.tool data/oilprice.json > /dev/null
          echo "Fetched $(wc -c < data/oilprice.json) bytes"

      - name: Summarise price changes
        id: diff
        run: |
          python3 .github/scripts/compare-oil-prices.py \
            /tmp/oilprice.old.json \
            data/oilprice.json \
            /tmp/price-summary.md \
            /tmp/price-changes.txt
          {
            echo "summary<<EOF"
            cat /tmp/price-summary.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -s /tmp/price-changes.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        run: cat /tmp/price-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oilprice.json
          SUBJECT="chore: update oil prices ($(TZ=Asia/Hong_Kong date +%Y-%m-%d))"
          {
            echo "$SUBJECT"
            echo ""
            echo "Price changes:"
            sed 's/\*\*//g' /tmp/price-changes.txt
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push

      - name: No changes
        if: steps.diff.outputs.changed != 'true'
        run: echo "No price changes — skipped commit."
